name: Android CI & APK Build

on:
  push:
    branches: ["main", "master", "**"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Ensure .env file exists for Secrets plugin
        run: cp -n .env.example .env || touch .env

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Release Signing Keystore
        id: release_signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            : "${STORE_PASSWORD:?STORE_PASSWORD secret is required}"
            : "${KEY_PASSWORD:?KEY_PASSWORD secret is required}"
            echo "Using release keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "STORE_PASSWORD=${STORE_PASSWORD}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${KEY_ALIAS:-upload}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${KEY_PASSWORD}" >> $GITHUB_ENV
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "Release signing secrets are not configured; skipping release build."
            echo "configured=false" >> $GITHUB_OUTPUT
          fi
          echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV

      - name: Build Debug APK
        run: ./gradlew assembleDebug -x test --console=plain

      - name: Build Signed Release APK
        if: steps.release_signing.outputs.configured == 'true'
        run: ./gradlew assembleRelease -x test --console=plain

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/OmniGet-debug.apk || true
          cp app/build/outputs/apk/release/*.apk dist/OmniGet-release-signed.apk || true
          ls -lh dist/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: dist/OmniGet-debug.apk
          retention-days: 30

      - name: Upload Release APK Artifact
        if: steps.release_signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed-apk
          path: dist/OmniGet-release-signed.apk
          retention-days: 30

      - name: Publish to GitHub Releases (on Tag Push)
        if: startsWith(github.ref, 'refs/tags/v') && steps.release_signing.outputs.configured == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OmniGet-release-signed.apk
            dist/OmniGet-debug.apk
          generate_release_notes: true
